<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Elsy Leonso Insurance</title>
    
    <!-- SEO and OpenGraph -->
    <meta name="description" content="Get in touch with Elsy Leonso Insurance for a quote or inquiry. Our dedicated team is here to help you with your insurance needs in Maryland.">
    <meta property="og:title" content="Contact Us | Elsy Leonso Insurance">
    <meta property="og:description" content="Get in touch with Elsy Leonso Insurance for a quote or inquiry.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://elsyleonso.com/contact-us/">
    <meta property="og:image" content="https://elsyleonso.com/assets/images/office-insice.webp">
    <meta property="og:site_name" content="Elsy Leonso Insurance">
    <meta property="og:locale" content="en_CA">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact Us | Elsy Leonso Insurance">
    <meta name="twitter:description" content="Get in touch with Elsy Leonso Insurance for a quote or inquiry.">
    <meta name="twitter:image" content="https://elsyleonso.com/assets/images/office-insice.webp">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/styles.css">
    
    <!-- Components -->
    <script src="/js/components.js" type="module"></script>
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-top: 3rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--color-primary);
        }
        .form-control {
            width: 100%;
            padding: 1rem;
            border: 1px solid rgba(13, 31, 60, 0.2);
            border-radius: var(--border-radius);
            font-family: var(--font-body);
            font-size: 1rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--color-secondary);
            box-shadow: 0 0 0 3px rgba(184, 154, 90, 0.2);
        }
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <site-header></site-header>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="section-title text-center">Contact Us</h1>
                <p class="section-subtitle text-center">We would love to hear from you. Reach out for a quote or any inquiries.</p>
                
                <div class="contact-grid">
                    <div>
                        <h3 class="text-primary" style="margin-bottom: 1.5rem;">Get in Touch</h3>
                        <p style="margin-bottom: 1rem;"><strong>Address:</strong> 123 Insurance Ave, Suite 100, Maryland, MD 20000</p>
                        <p style="margin-bottom: 1rem;"><strong>Phone:</strong> (123) 456-7890</p>
                        <p style="margin-bottom: 2rem;"><strong>Email:</strong> info@elsyleonso.com</p>
                        
                        <div style="border-radius: var(--border-radius); overflow: hidden; box-shadow: var(--shadow-md);">
                            <!-- Placeholder for a map -->
                            <img src="/assets/images/front-office.webp" alt="Our Office" style="width: 100%; height: 300px; object-fit: cover;">
                        </div>
                    </div>
                    
                    <div>
                        <form action="#" method="POST" style="background: var(--color-surface); padding: 3rem; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
                            <div class="form-group">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" name="name" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" name="phone" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="message">Your Message</label>
                                <textarea id="message" name="message" class="form-control" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <site-footer></site-footer>

</body>
</html>
